paths:
  input_dir: input
  output_dir: output
  runs_dir: runs
  static_dir: data-raw/static
  data_drop_root: ''
  variable_dictionary: model.yml
  models: model.yml
  model_config: config/model_config.yml
  model_inputs: model_inputs.yml
run:
  internal_model: internal_v4_production
  external_model: external_gcc_v7
  on_validation_error: warn
  extract_date: ''
  overwrite: yes
  verbose: yes
  max_upload_size_mb: 500
logging:
  log_file: output/etl_run.log
  level: INFO
approval:
  enforce_separation_of_duties: no
assistant:
  enabled: yes
  endpoint: https://aimodel.qdb.qa/v1/chat/completions
  model: unsloth/gemma-3-12b-it
  temperature: 0.3
  top_p: 0.8
  max_tokens: 1024
  timeout_seconds: 60
  api_key_env: QDB_LLM_API_KEY
  max_history_turns: 8
  max_context_chars: 24000
  max_tool_calls: 6
  verify_ssl: yes

