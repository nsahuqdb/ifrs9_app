# IFRS9 ETL — runtime configuration
#
# Edit the `paths:` block below to point at your real folders. The values
# below are the defaults for running against the bundled sample inputs.
#
# In the original Excel tool these were hardcoded to:
#   input  : \\mvlicb01\IFRSIN\
#   output : \\mvlicb01\IFRSOUT\
# Both are now parameterised here.

paths:
  # Where to read raw input files from (matches the Excel tool's IFRSIN folder)
  input_dir: "input"

  # Where to write the 18 output CSV files (matches the Excel tool's IFRSOUT folder)
  output_dir: "output"

  # Where the keep_history=TRUE mode writes timestamped runs. The Shiny app
  # reads from this directory to populate the Runs page. Independent of
  # output_dir — output_dir is for single-folder batch runs; runs_dir is
  # the permanent archive of all runs for browsing in the app.
  runs_dir: "runs"

  # Static reference data extracted once from the Excel tool — committed to git
  static_dir: "data-raw/static"

  # Optional: a "data drop" folder where the data team writes the monthly
  # input bundle. Each immediate subfolder is treated as one drop (typically
  # named by month, e.g. 2026-01/). The Run pipeline page lets the user pick
  # one of these subfolders as the input source for a run, in addition to
  # the configured input_dir or an uploaded zip.
  #
  # If unset or pointing to a missing path, the "Data drop folder" option in
  # the UI is hidden — input_dir + zip upload remain available.
  data_drop_root: ""

  # Variable dictionary — registry of every macroeconomic variable used by
  # any model. Models reference variables by id (VAR_*).
  variable_dictionary: "config/model.yml"

  # Model registry — coefficients, weights, and component variables for every
  # satellite PD model the team can switch between.
  models: "config/model.yml"

  # Legacy single-model config (kept for backwards compatibility — emits a
  # deprecation warning if used directly. Loader auto-routes to models.yml
  # when paths$models is set above).
  model_config: "config/model_config.yml"

  # Per-run model inputs (scenario weights, MEV forecasts) — typically
  # updated by the user before each run when the workbook is refreshed.
  model_inputs: "config/model_inputs.yml"

  # Optional: directory of reference output CSVs to reconcile against in
  # Phase H5. Leave commented out for production runs (where there is no
  # bundled reference). Useful during development to compare against a
  # previous run or against the V4 bundle for spot-checks.
  # reference_outputs: "../output_files/Output"

run:
  # Active models: names under `models:` in config/model.yml.
  internal_model: "internal_v4_production"
  external_model: "external_gcc_v7"

  # Behaviour when a validation check fails. One of:
  #   "stop"   - halt the run on any ERROR-level failure (PRODUCTION default)
  #   "warn"   - emit warnings, never halt; current default during
  #              development / methodology iteration so the operator can
  #              see all findings in one pass instead of being blocked by
  #              the first error
  #   "ignore" - record results but proceed silently
  # WARN/INFO findings never halt regardless of this setting; they are
  # always recorded in reports/validation.md and reports/validation.csv.
  #
  # IMPORTANT: change this to "stop" before promoting a deployment to
  # production. Leaving it as "warn" in production means duplicate IDs,
  # blank required fields, and bad data types will silently flow through
  # to the ECL calculation.
  on_validation_error: "warn"

  # Extract / reporting date for this run (the EXTRACTDA column in all outputs).
  # Leave empty: the run takes the reporting date from the uploaded
  # AccountMaster EXTRACTDA automatically, so this never needs hand-editing.
  # Set a YYYY-MM-DD value only to force a fallback when inputs carry no date.
  extract_date: ""

  # Unit of ALLOCATIONPERCENTAGE in AccountCollateralAllocation. One of:
  #   "percent"  - 57.25 means 57.25% (the extract's convention; the default)
  #   "fraction" - 0.5725 means 57.25%
  #   "auto"     - the old guess: percent when any value is above 1, else
  #                fraction. A file whose percentages are all at most 1% is
  #                then read as fractions, 100 times too large.
  # The pre-run check (INPUT_ACA_allocation_unit_consistent) fails when the
  # file's values contradict this setting.
  allocation_percentage_unit: "percent"

  # Whether to overwrite existing output files in output_dir
  overwrite: true

  # Verbose logging
  verbose: true

  # Maximum file-upload size for the Shiny app's "Upload zip" input source,
  # in megabytes. Default 500. Bank input bundles regularly exceed the
  # built-in Shiny default of 5 MB. Lower this if you're deploying on a
  # constrained host; raise it if your bundle is unusually large.
  max_upload_size_mb: 500

logging:
  # Log file location (NULL = console only)
  log_file: "output/etl_run.log"
  level: "INFO"   # one of: DEBUG, INFO, WARN, ERROR

# ----------------------------------------------------------------------------
# Approval workflow
#
# Two-stage maker -> checker:
#   1. The user who runs the pipeline is the implicit "maker" (no separate
#      Submit step — finishing a run is the act of submitting).
#   2. A "checker" reviews and either approves (run becomes exportable)
#      or rejects (terminal — fix the underlying issue and re-run).
#
# Separation of duties:
#   - enforce_separation_of_duties: TRUE  -> the maker cannot also approve
#     their own run. Use in production.
#   - enforce_separation_of_duties: FALSE -> the maker may approve their
#     own run. Use in dev/test where one person tests the full flow.
#
# A banner appears in the Approval queue UI when separation is disabled,
# making the relaxed control visible. The flag's value at run time is also
# captured in the run's manifest, so a reviewer 6 months later can see
# what governance was in force when the run was approved.
# ----------------------------------------------------------------------------
approval:
  enforce_separation_of_duties: false


# ----------------------------------------------------------------------------
# In-app AI assistant (the "Assistant" tab).
#
# Backed by QDB's internal LLM endpoint (OpenAI-compatible /v1/chat/completions).
# The assistant is grounded on this deployment's own artifacts — run history,
# config, methodology notes (NOTES.md), and output CSVs — so it answers
# questions about runs, approvals, data, config, and methodology. It is
# read-only and cannot trigger runs or change settings.
#
# SECURITY: never put an API key here. If the endpoint requires auth, set the
# environment variable named in `api_key_env` (default QDB_LLM_API_KEY) on the
# app host; the app reads it at call time and sends it as a Bearer token. With
# no such env var set, no Authorization header is sent (matches the Postman
# collection, which uses none).
# ----------------------------------------------------------------------------
assistant:
  enabled: true
  endpoint: "https://aimodel.qdb.qa/v1/chat/completions"
  model: "unsloth/gemma-3-12b-it"
  temperature: 0.3        # lower than the Postman default (0.7) for factual grounding
  top_p: 0.8
  max_tokens: 1024
  timeout_seconds: 60
  api_key_env: "QDB_LLM_API_KEY"   # env var name; leave endpoint open if unset
  max_history_turns: 8             # how many prior turns to send for context
  max_context_chars: 24000         # cap on injected grounding context
  max_tool_calls: 6                # max analytics tool calls per question (agentic loop)
  verify_ssl: true                 # set false only if the internal cert isn't trusted
